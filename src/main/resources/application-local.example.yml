# Copy to `application-local.yml` (git-ignored), then run with profile `dev,local`.
# This is the Java equivalent of .NET "User Secrets": a local-only file that never reaches Git.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartstock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
    username: smartstock
    password: change-me

app:
  jwt:
    secret: replace-with-a-random-string-of-at-least-32-characters
  llm:
    api-key: ""   # cloud provider key; leave empty for the mock. Local Ollama: use profile `ollama` instead
