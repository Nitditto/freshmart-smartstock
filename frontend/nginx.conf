server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API container; "api" is its service name in docker-compose.yml.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # POST /api/receipts/parse can wait for a local LLM for minutes.
        proxy_read_timeout 240s;
    }

    # Single-page app: unknown paths (e.g. /products on reload) fall back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed asset files never change, so browsers may cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
